name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  backend-ci:
    name: Backend (.NET) CI
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore backend/Foliora.slnx

    - name: Build solution
      run: dotnet build backend/Foliora.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test backend/Foliora.slnx --no-build --configuration Release --verbosity normal


  backend-cd:
    name: Backend CD (Publish to GHCR)
    needs: [backend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-api
        tags: |
          type=ref,event=branch
          type=sha,format=short

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}


  deploy-dev:
    name: DEV Deployment
    needs: [backend-cd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    environment: development

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run DEV Deployment Script
      shell: bash
      run: |
        chmod +x backend/deploy-dev.sh
        IMAGE_TAG=develop ./backend/deploy-dev.sh
      env:
        DEV_DB_CONNECTION: ${{ secrets.DEV_DB_CONNECTION }}

  deploy-prod:
    name: PROD Deployment
    needs: [backend-cd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run PROD Deployment Script
      shell: bash
      run: |
        chmod +x backend/deploy-prod.sh
        IMAGE_TAG=main ./backend/deploy-prod.sh
      env:
        PROD_SUPABASE_CONNECTION_STRING: ${{ secrets.PROD_SUPABASE_CONNECTION_STRING }}
