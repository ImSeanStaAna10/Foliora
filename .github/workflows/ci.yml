name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend (.NET) CI
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore dependencies
      run: dotnet restore backend/Foliora.slnx

    - name: Build solution
      run: dotnet build backend/Foliora.slnx --no-restore --configuration Release

    - name: Run tests
      run: dotnet test backend/Foliora.slnx --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend (React) CI Placeholder
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Frontend CI Check (Placeholder)
      run: |
        if [ -d "frontend" ]; then
          cd frontend
          npm ci
          npm run build --if-present
        else
          echo "Frontend directory not initialized yet. Skipping frontend build step."
        fi
