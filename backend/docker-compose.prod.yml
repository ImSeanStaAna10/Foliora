version: '3.8'

services:
  api:
    image: ${FOLRIOA_API_IMAGE:-ghcr.io/imseanstaana10/foliora-api:main}
    container_name: foliora-api-prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${PROD_SUPABASE_CONNECTION_STRING}
    ports:
      - "8090:8080"
    restart: unless-stopped
