version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: foliora-postgres-dev
    environment:
      POSTGRES_DB: foliora_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: foliora-api-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=foliora_dev;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
